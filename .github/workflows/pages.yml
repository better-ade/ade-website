name: Pages

# Builds the site and publishes it with GitHub Pages (source: GitHub Actions).
# The installers are copied in from ade-terminal at build time, so the daily run
# picks up a new release's install.sh / install.ps1 without a commit here. The
# download count (scripts/fetch-downloads.sh) is refreshed the same way.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fetch the installers
        run: scripts/fetch-installers.sh site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The download count for the hero and Get started. Never fails the build:
      # without a usable count the pages leave the line out.
      - name: Fetch the download count
        run: scripts/fetch-downloads.sh site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the site
        run: bundle exec jekyll build -s site -d _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
