name: CI

on:
  pull_request:
  push:
    branches: [main]
  # ade-terminal can change what the site describes without a commit here; a
  # daily run catches that drift.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests hold the site to ADE's own code, so they read a checkout of it.
      # ade-terminal is public: no token needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: better-ade/ade-terminal
          path: ade-terminal

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
        env:
          ADE_TERMINAL_DIR: ade-terminal

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fetch the installers
        run: scripts/fetch-installers.sh site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the site
        run: bundle exec jekyll build -s site -d _site --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: The installers are served from the site root
        run: |
          head -n1 _site/install.sh | grep -q '^#!'
          test -s _site/install.ps1
