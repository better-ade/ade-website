name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The repos the site describes can change on main without a commit here; a
  # daily run catches that drift (a renamed command, a new release, a merged
  # Coming item).
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The truth tests hold the pages to main of the repos they describe.
      # All are public: no token needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-cli, path: repos/ade-cli }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-brain, path: repos/ade-brain }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-method, path: repos/ade-method }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-agent-registry, path: repos/ade-agent-registry }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-skills, path: repos/ade-skills }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: better-ade/ade-secrets, path: repos/ade-secrets }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # siteScenarioWebkit draws the home page in WebKit (Safari) and Chromium.
      - run: npx playwright install --with-deps chromium webkit

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fetch the installers
        run: scripts/fetch-installers.sh site
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Built before the tests: most of them check the built pages (links,
      # titles, descriptions, the policy on every page, the installers).
      - name: Build the site
        run: bundle exec jekyll build -s site -d _site --strict_front_matter
        env:
          JEKYLL_ENV: production

      - run: npm test

      - name: The installers are served from the site root
        run: |
          head -n1 _site/install.sh | grep -q '^#!'
          test -s _site/install.ps1
