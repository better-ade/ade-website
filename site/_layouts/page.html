---
layout: default
body_class: plain-page
---
<div class="wrap page">
  <article class="page-body prose">
    {% if page.kicker %}<span class="kicker guide-kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
    {{ content }}
  </article>
</div>
