<!doctype html>
<html lang="en">
<head>
{% include head.html %}
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body class="plain-page">
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
<div class="wrap page">
  <article class="page-body prose">
    <h1>{{ page.title }}</h1>
    <p>This page has moved: <a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label }}</a>.</p>
  </article>
</div>
</main>
{% include footer.html %}
</body>
</html>
