# The Pages workflow (.github/workflows/pages.yml) builds this folder with Jekyll. Copy comes from docs/messaging.md
# at the repo root: change the story there first, then the pages.
title: ADE
tagline: Verified, not vibed.
description: >-
  For software teams and product managers who want AI to ship real work, ADE is the AI delivery team that turns
  tickets into verified, reviewed changes, unlike general AI assistants that leave you to check everything they do.
url: https://ade.ardata.tech
baseurl: ""

# The better-ade organisation and the repos the pages link to most.
org_url: https://github.com/better-ade
cli_repo: https://github.com/better-ade/ade-cli
brain_repo: https://github.com/better-ade/ade-brain
app_repo: https://github.com/better-ade/ade-terminal
# The one-line installer for the ade command (ade-cli's install.sh, piped).
cli_install: curl -fsSL https://raw.githubusercontent.com/better-ade/ade-cli/main/install.sh | bash
# The desktop app's installers, copied into the site at build time (scripts/fetch-installers.sh).
app_install: curl -fsSL https://ade.ardata.tech/install.sh | bash
# The issue form the home page's first button opens (.github/ISSUE_TEMPLATE/ade-computer-preview.yml).
preview_url: https://github.com/better-ade/ade-website/issues/new?template=ade-computer-preview.yml

plugins:
  - jekyll-sitemap

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

defaults:
  - scope:
      path: guide
    values:
      layout: guide
  # Old addresses (the app-era guide, the agent hub guide, the training) that now point at their new home.
  - scope:
      path: redirects
    values:
      layout: redirect
      sitemap: false

# Kept in the output as the old branch build had it. With an Actions deploy the
# custom domain comes from the repository's Pages settings, not this file.
include:
  - CNAME
