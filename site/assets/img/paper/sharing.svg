<g font-weight="700" text-anchor="middle"><text x="96" y="66" fill="#6d28d9">Sender's keychain</text><text x="270" y="66">bin/keys share</text>
<text x="444" y="66" fill="#1a7f37">Sealed block</text><text x="618" y="66">bin/keys receive</text><text x="792" y="66" fill="#6d28d9">Their keychain</text>
<text x="270" y="196">Their GitHub keys</text><text x="618" y="196">Their SSH key</text></g>
<g fill="#3a3a44" font-size="12" text-anchor="middle"><text x="96" y="88">values, never shown</text><text x="270" y="88">signs, then age seals</text>
<text x="444" y="88">chat, email or a one-time link</text><text x="618" y="88">verifies, then asks</text><text x="792" y="88">stored, never shown</text>
<text x="270" y="218">public; you confirm them</text><text x="618" y="218">private, stays with them</text></g>
