<text x="182" y="34" fill="#59636e" font-size="11" text-anchor="middle">pipe</text>
<path d="M444 196V108" stroke="#cf222e" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#r)"/>
<g fill="#cf222e" font-size="12" text-anchor="middle"><text x="444" y="214">✗ anyone else who sees it</text><text x="444" y="230">cannot open it</text></g>
<text x="20" y="275" fill="#59636e" font-size="12">No value in a file, an argument, git or on a server. The sender signs; receive checks it against their GitHub keys and asks first.</text>
