<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="-apple-system,Helvetica Neue,Arial,sans-serif" font-size="13">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker>
</defs>
<rect width="880" height="330" fill="#fff"/>
<g fill="#fff" stroke="#59636e" stroke-width="1.3">
 <rect x="15" y="30" width="140" height="70" rx="10"/><rect x="185" y="30" width="150" height="70" rx="10"/>
 <rect x="365" y="30" width="150" height="70" rx="10"/><rect x="545" y="30" width="150" height="70" rx="10"/>
</g>
<rect x="725" y="30" width="140" height="70" rx="10" fill="#0b0b0e"/>
<g font-weight="700"><text x="30" y="58">Intent</text><text x="200" y="58" fill="#c2410c">Product</text><text x="380" y="58" fill="#c2410c">Developer</text><text x="560" y="58" fill="#6d28d9">Reviewer</text><text x="740" y="58" fill="#fff">Done</text></g>
<g fill="#3a3a44" font-size="12"><text x="30" y="78">owner, in plain words</text><text x="30" y="93">(Telegram or terminal)</text>
<text x="200" y="78">story · ≤10 criteria</text><text x="200" y="93">risk: low / medium / high</text>
<text x="380" y="78">failing test first</text><text x="380" y="93">then minimal code</text>
<text x="560" y="78">runs verification cmd</text><text x="560" y="93">records real output</text></g>
<g fill="#c9c9d1" font-size="12"><text x="740" y="78">journal line</text><text x="740" y="93">merge · release</text></g>
<g stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M155 65H183"/><path d="M335 65H363"/><path d="M515 65H543"/><path d="M695 65H723"/></g>
<!-- risk lanes -->
<text x="545" y="140" font-weight="700">Review by risk (one pass)</text>
<g font-size="12">
 <rect x="545" y="152" width="320" height="34" rx="8" fill="#f4f4f6"/><text x="558" y="174"><tspan font-weight="700">low</tspan> · verification command only</text>
 <rect x="545" y="194" width="320" height="34" rx="8" fill="#f4f4f6"/><text x="558" y="216"><tspan font-weight="700">medium</tspan> · quick review, smaller model</text>
 <rect x="545" y="236" width="320" height="50" rx="8" fill="none" stroke="url(#g)" stroke-width="2"/><text x="558" y="257"><tspan font-weight="700">high</tspan> · thorough + adversarial, stronger model</text><text x="558" y="276">at most one fix round</text>
</g>
<path d="M620 100V150" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<!-- fix loop -->
<path d="M545 270H440Q420 270 420 250V102" stroke="#c2410c" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="250" y="190" fill="#c2410c" font-size="12">red, or blocking findings:</text><text x="250" y="206" fill="#c2410c" font-size="12">one fix round, same builder</text>
<path d="M705 286V310H40" stroke="#6d28d9" stroke-width="1.4" fill="none" stroke-dasharray="3 4"/>
<text x="40" y="303" fill="#6d28d9" font-size="12">still unresolved after the fix round → back to the owner with the findings; not Done</text>
</svg>
