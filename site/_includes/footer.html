<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="ADE home">
        <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="28" height="28">
        <span>ADE</span>
      </a>
      <p>Your AI delivery team. Verified, not vibed.</p>
    </div>
    <div class="footer-cols">
      <div>
        <h3>ADE</h3>
        <a href="{{ '/#how-it-works' | relative_url }}">How it works</a>
        <a href="{{ '/#who' | relative_url }}">Who it&rsquo;s for</a>
        <a href="{{ '/#faq' | relative_url }}">Questions</a>
        <a href="{{ '/app/' | relative_url }}">The ADE app</a>
      </div>
      <div>
        <h3>Guide</h3>
        {% for item in site.data.guide %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </div>
      <div>
        <h3>Source</h3>
        <a href="{{ '/repos/' | relative_url }}">Repos</a>
        <a href="{{ site.org_url }}">GitHub</a>
        <a href="{{ site.cli_repo }}/blob/main/LICENSE">MIT License</a>
      </div>
    </div>
  </div>
  <div class="wrap"><div class="footer-note"><span>ADE &middot; open source, MIT licensed</span><span>What is not merged yet is marked <span class="coming">Coming</span></span></div></div>
</footer>
